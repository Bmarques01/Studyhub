{# Lista de disciplinas agrupadas (categoria · período). A escolhida vem de "filtro". #}
<select name="disciplina" required aria-label="Disciplina">
    <option value="">disciplina…</option>
    {% for rotulo, disciplinas in opcoes %}
        <optgroup label="{{ rotulo }}">
            {% for d in disciplinas %}
                <option value="{{ d.id }}" {% if filtro.id == d.id %}selected{% endif %}>{{ d.nome }}</option>
            {% endfor %}
        </optgroup>
    {% endfor %}
</select>
