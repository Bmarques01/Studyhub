{# Disciplina (obrigatória) + tópico (opcional). O flashcards.js troca os tópicos ao mudar a disciplina. #}
<div class="form-linha">
    <select name="disciplina" required aria-label="Disciplina">
        <option value="">disciplina…</option>
        {% for rotulo, disciplinas in opcoes %}
            <optgroup label="{{ rotulo }}">
                {% for d in disciplinas %}
                    <option value="{{ d.id }}" {% if filtro.id == d.id %}selected{% endif %}>{{ d.nome }}</option>
                {% endfor %}
            </optgroup>
        {% endfor %}
    </select>
    <select name="topico" aria-label="Tópico (opcional)">
        <option value="">sem tópico</option>
    </select>
</div>
