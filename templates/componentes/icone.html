{# Ícones simples em SVG. Uso: {% include "componentes/icone.html" with nome="pomodoro" %} #}
<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if nome == "dashboard" %}
    <rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/>
    <rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>
{% elif nome == "pomodoro" %}
    <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M10 2h4"/>
{% elif nome == "estudos" %}
    <path d="M2 5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a2.5 2.5 0 0 0-2.5-2.5H2z"/>
    <path d="M22 5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a2.5 2.5 0 0 1 2.5-2.5H22z"/>
{% elif nome == "calendario" %}
    <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>
{% elif nome == "projetos" %}
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{% elif nome == "cadernos" %}
    <path d="M5 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5z"/><path d="M9 3v18M12 8h4M12 12h4"/>
{% elif nome == "flashcards" %}
    <rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>
{% elif nome == "erros" %}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>
{% elif nome == "curso" %}
    <path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>
{% elif nome == "sino" %}
    <path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>
{% elif nome == "recomecar" %}
    <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
{% elif nome == "pular" %}
    <path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/>
{% elif nome == "play" %}
    <path d="M7 4.5v15l12-7.5z"/>
{% endif %}
</svg>
