{# Ícones simples em SVG. Uso: {% include "componentes/icone.html" with nome="pomodoro" %} #}
<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if nome == "dashboard" %}
    <rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/>
    <rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>
{% elif nome == "pomodoro" %}
    <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M10 2h4"/>
{% elif nome == "estudos" %}
    <path d="M2 5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a2.5 2.5 0 0 0-2.5-2.5H2z"/>
    <path d="M22 5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a2.5 2.5 0 0 1 2.5-2.5H22z"/>
{% elif nome == "calendario" %}
    <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>
{% elif nome == "projetos" %}
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{% elif nome == "cadernos" %}
    <path d="M5 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5z"/><path d="M9 3v18M12 8h4M12 12h4"/>
{% elif nome == "flashcards" %}
    <rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>
{% elif nome == "questoes" %}
    <circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-.9.8-.9 1.4v.6M12 16.8v.2"/>
{% elif nome == "erros" %}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>
{% elif nome == "melhorar" %}
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{% elif nome == "curso" %}
    <path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/>
{% elif nome == "recomecar" %}
    <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
{% elif nome == "pular" %}
    <path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/>
{% elif nome == "parar" %}
    <rect x="6" y="6" width="12" height="12" rx="2"/>
{% elif nome == "pausa" %}
    <path d="M8 5v14M16 5v14"/>
{% elif nome == "play" %}
    <path d="M7 4.5v15l12-7.5z"/>
{% elif nome == "ruido" %}
    <path d="M3 12h1M7 9v6M11 5v14M15 8v8M19 10v4"/>
{% elif nome == "lixeira" %}
    <path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>
{% elif nome == "tela-cheia" %}
    <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
{% elif nome == "lua" %}
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
{% elif nome == "sol" %}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{% elif nome == "sair" %}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
{% elif nome == "enviar" %}
    <path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
{% endif %}
</svg>
